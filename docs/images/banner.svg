<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Optical Search Beam Gradients -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="rim-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="rim-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- 3D Wordart Gradients -->
    <linearGradient id="letter-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= LEFT EMBLEM: ISOMETRIC STACK & MAGNIFYING GLASS ================= -->
  <g id="isometric-emblem" transform="translate(15, 5)">
    
    <!-- Subtle Isometric Base Grid -->
    <g stroke="#64748B" stroke-width="1" stroke-dasharray="3,4" opacity="0.45">
      <line x1="180" y1="150" x2="310" y2="225" />
      <line x1="140" y1="173" x2="270" y2="248" />
      <line x1="100" y1="196" x2="230" y2="271" />
      <line x1="60"  y1="219" x2="190" y2="294" />
      
      <line x1="180" y1="150" x2="50"  y2="225" />
      <line x1="220" y1="173" x2="90"  y2="248" />
      <line x1="260" y1="196" x2="130" y2="271" />
      <line x1="300" y1="219" x2="170" y2="294" />
    </g>

    <!-- DOCUMENT LAYER 3 (Bottom Corpus Layer, cy = 228) -->
    <g id="doc-layer-bottom">
      <!-- Left Thickness -->
      <polygon points="80,228 180,286 180,295 80,237" fill="#1E293B" />
      <!-- Right Thickness -->
      <polygon points="180,286 280,228 280,237 180,295" fill="#0F172A" />
      <!-- Top Plane -->
      <polygon points="180,170 280,228 180,286 80,228" fill="#334155" stroke="#64748B" stroke-width="1.2" />
      <!-- Isometric Text Chunk Lines -->
      <line x1="155" y1="198" x2="215" y2="233" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
      <line x1="140" y1="207" x2="205" y2="244" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
      <line x1="125" y1="216" x2="175" y2="245" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- DOCUMENT LAYER 2 (Middle TEI/XML Structured Layer, cy = 192) -->
    <g id="doc-layer-middle">
      <!-- Left Thickness -->
      <polygon points="80,192 180,250 180,259 80,201" fill="#334155" />
      <!-- Right Thickness -->
      <polygon points="180,250 280,192 280,201 180,259" fill="#1E293B" />
      <!-- Top Plane -->
      <polygon points="180,134 280,192 180,250 80,192" fill="#475569" stroke="#94A3B8" stroke-width="1.2" />
      <!-- Illuminated Projection Zone -->
      <ellipse cx="180" cy="192" rx="56" ry="32" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3" />
      <!-- Isometric Text Chunk Lines -->
      <line x1="160" y1="158" x2="225" y2="195" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
      <line x1="145" y1="167" x2="210" y2="204" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
      <line x1="130" y1="176" x2="195" y2="213" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
      <line x1="115" y1="185" x2="165" y2="214" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- DOCUMENT LAYER 1 (Top High-Relevance Extracted Layer, cy = 156) -->
    <g id="doc-layer-top">
      <!-- Left Thickness -->
      <polygon points="80,156 180,214 180,223 80,165" fill="#065F46" />
      <!-- Right Thickness -->
      <polygon points="180,214 280,156 280,165 180,223" fill="#064E3B" />
      <!-- Top Plane -->
      <polygon points="180,98 280,156 180,214 80,156" fill="#1E293B" stroke="#34D399" stroke-width="1.6" />
      <!-- Active Search Target Zone -->
      <ellipse cx="180" cy="156" rx="48" ry="27.7" fill="#10B981" fill-opacity="0.25" stroke="#6EE7B7" stroke-width="1.2" />
      <!-- Highlighted Knowledge Graph / Vector Nodes inside the beam -->
      <g stroke="#A7F3D0" stroke-width="1.8">
        <line x1="155" y1="148" x2="182" y2="142" />
        <line x1="182" y1="142" x2="205" y2="158" />
        <line x1="182" y1="142" x2="175" y2="166" />
        <line x1="155" y1="148" x2="175" y2="166" />
        <line x1="175" y1="166" x2="205" y2="158" />
      </g>
      <circle cx="155" cy="148" r="3.5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1" />
      <circle cx="182" cy="142" r="4" fill="#34D399" stroke="#ECFDF5" stroke-width="1.2" />
      <circle cx="205" cy="158" r="3.5" fill="#34D399" stroke="#ECFDF5" stroke-width="1" />
      <circle cx="175" cy="166" r="4" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.2" />
    </g>

    <!-- OPTICAL PROJECTION BEAM (From Loupe at y=86 down to Stack at y=228) -->
    <polygon points="122,86 238,86 254,228 106,228" fill="url(#beam-grad)" />
    <!-- Vertical Laser Guide Lines -->
    <line x1="122" y1="86" x2="110" y2="200" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7" />
    <line x1="238" y1="86" x2="250" y2="200" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7" />

    <!-- ================= 3D ISOMETRIC MAGNIFYING GLASS ================= -->
    <g id="isometric-magnifying-glass">
      <!-- Outer Cylinder Wall (Extruded Rim Side) -->
      <path d="M 108,72 L 108,88 A 72,41.6 0 0,0 252,88 L 252,72 A 72,41.6 0 0,1 108,72 Z" fill="url(#rim-side)" stroke="#78350F" stroke-width="1" />

      <!-- Inner Cylinder Wall (Visible Back Interior Edge of Rim) -->
      <path d="M 122,72 A 58,33.5 0 0,1 238,72 L 238,82 A 58,33.5 0 0,0 122,82 Z" fill="#451A03" />

      <!-- Isometric Glass Lens Surface -->
      <ellipse cx="180" cy="75" rx="58" ry="33.5" fill="url(#glass-fill)" stroke="#6EE7B7" stroke-width="1.5" />

      <!-- Crisp Specular Glints Across the Lens -->
      <path d="M 140,62 L 175,47 L 190,47 L 148,66 Z" fill="#FFFFFF" fill-opacity="0.45" />
      <path d="M 155,70 L 202,50 L 208,52 L 160,73 Z" fill="#FFFFFF" fill-opacity="0.25" />

      <!-- Top Bezel Ring of the Magnifying Glass (Donut Compound Path) -->
      <path d="M 108,72 A 72,41.6 0 1,0 252,72 A 72,41.6 0 1,0 108,72 Z M 122,72 A 58,33.5 0 1,1 238,72 A 58,33.5 0 1,1 122,72 Z" fill="url(#rim-top)" fill-rule="evenodd" stroke="#FDE68A" stroke-width="1.2" />

      <!-- 3D Isometric Handle (Extending Down-Left along Isometric Axis) -->
      <g id="loupe-handle">
        <!-- Gold Ferrule / Neck Connector -->
        <polygon points="122,94 136,102 122,110 108,102" fill="#F59E0B" stroke="#FEF3C7" stroke-width="0.8" />
        <polygon points="108,102 122,110 122,120 108,112" fill="#D97706" />
        <polygon points="122,110 136,102 136,112 122,120" fill="#92400E" />

        <!-- Handle Grip Top Face -->
        <polygon points="111,100 125,108 55,148 41,140" fill="#475569" stroke="#94A3B8" stroke-width="1" />
        <!-- Handle Grip Right/Front Extruded Face -->
        <polygon points="125,108 55,148 55,162 125,122" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
        <!-- Handle Grip Left/Bottom Cap Face -->
        <polygon points="41,140 55,148 55,162 41,154" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
        <!-- Amber Grip Accent Stripe -->
        <polygon points="98,110 108,116 66,140 56,134" fill="#F59E0B" />
      </g>
    </g>
  </g>

  <!-- ================= RIGHT SECTION: 3D EXTRUDED "LENS" WORDART ================= -->
  <!-- Each letter has a 3D isometric extrusion offset of dx = +14, dy = -10 -->
  <g id="wordart-section" transform="translate(365, 58)">

    <!-- Subtle Floating Isometric Background Accent Framing the Wordart -->
    <line x1="0" y1="158" x2="510" y2="158" stroke="#10B981" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="158" r="4" fill="#10B981" />
    <circle cx="510" cy="158" r="4" fill="#F59E0B" />

    <!-- ==================== LETTER "L" ==================== -->
    <g id="letter-L" transform="translate(0, 0)">
      <polygon points="0,0 14,-10 44,-10 30,0" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,0 44,-10 44,94 30,104" fill="#B45309" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,104 44,94 99,94 85,104" fill="#FDE68A" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="85,104 99,94 99,120 85,130" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="0,0 30,0 30,104 85,104 85,130 0,130" fill="url(#letter-front)" stroke="#FEF3C7" stroke-width="1.2" stroke-linejoin="round" />
    </g>

    <!-- ==================== LETTER "E" ==================== -->
    <g id="letter-E" transform="translate(120, 0)">
      <polygon points="0,0 14,-10 104,-10 90,0" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="90,0 104,-10 104,16 90,26" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,26 44,16 44,42 30,52" fill="#B45309" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,52 44,42 89,42 75,52" fill="#FDE68A" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="75,52 89,42 89,68 75,78" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,78 44,68 44,94 30,104" fill="#B45309" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,104 44,94 104,94 90,104" fill="#FDE68A" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="90,104 104,94 104,120 90,130" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="0,0 90,0 90,26 30,26 30,52 75,52 75,78 30,78 30,104 90,104 90,130 0,130" fill="url(#letter-front)" stroke="#FEF3C7" stroke-width="1.2" stroke-linejoin="round" />
    </g>

    <!-- ==================== LETTER "N" ==================== -->
    <g id="letter-N" transform="translate(245, 0)">
      <polygon points="0,0 14,-10 44,-10 30,0" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,0 44,-10 89,70 75,80" fill="#D97706" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,50 44,40 44,120 30,130" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="75,0 89,-10 119,-10 105,0" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="105,0 119,-10 119,120 105,130" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="0,0 30,0 75,80 75,0 105,0 105,130 75,130 30,50 30,130 0,130" fill="url(#letter-front)" stroke="#FEF3C7" stroke-width="1.2" stroke-linejoin="round" />
    </g>

    <!-- ==================== LETTER "S" ==================== -->
    <g id="letter-S" transform="translate(385, 0)">
      <polygon points="0,0 14,-10 109,-10 95,0" fill="#FEF3C7" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="95,0 109,-10 109,16 95,26" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,26 44,16 44,42 30,52" fill="#B45309" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="30,52 44,42 109,42 95,52" fill="#FDE68A" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="95,52 109,42 109,120 95,130" fill="#92400E" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="0,104 14,94 65,94 65,104" fill="#FDE68A" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round" />
      <polygon points="0,0 95,0 95,26 30,26 30,52 95,52 95,130 0,130 0,104 65,104 65,78 0,78" fill="url(#letter-front)" stroke="#FEF3C7" stroke-width="1.2" stroke-linejoin="round" />
    </g>

    <!-- Isometric Tech Tagline / Subtitle Pills -->
    <g transform="translate(2, 178)">
      <!-- Emerald Status Badge -->
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#10B981" />
      <!-- Pure Vector Path Subtitle: LITERATURE EVIDENCE & NARRATIVE SYNTHESIS -->
      <text x="24" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13.5" font-weight="700" fill="#10B981" letter-spacing="2.2">LITERATURE EVIDENCE &amp; NARRATIVE SYNTHESIS</text>
    </g>
  </g>
</svg>