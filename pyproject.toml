[project]
name = "lens"
version = "0.1.0"
description = "LENS - Literature Evidence & Narrative Synthesis: an agentic systematic-literature-review harness over a GROBID-structured arXiv cs.AI corpus."
readme = "README.md"
authors = [
    { name = "Ge Rui Sen", email = "greyson.rg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "gliner>=0.2.29",
    "glirel>=1.2.1",
    "ijson>=3.5.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "lxml-stubs>=0.5.1",
    "networkx>=3.6.1",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "torch>=2.6.0",
    "transformers>=5.16.1",
]

[project.scripts]
lens = "lens:main"

# UI. An extra, not a runtime dependency: the core install, the
# ``lens-repl`` image and the no-key suite must never need Streamlit.
# ``st.fragment(run_every=)`` needs >= 1.37.
[project.optional-dependencies]
ui = ["streamlit>=1.37"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ------------------------------------------------------------------- tooling
# `ruff format` is the formatter of record, so lint and format cannot disagree
# about line length. Both run in CI-shaped checks: `ruff check .` and
# `ruff format --check .`.
[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# These tests drop the papers/chunks tables; they are excluded from discovery too.
extend-exclude = ["tests/DESTRUCTIVE_db_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["lens"]

