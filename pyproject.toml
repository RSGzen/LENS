[project]
name = "lens"
version = "0.1.0"
description = "LENS - Literature Evidence & Narrative Synthesis: an agentic systematic-literature-review harness over a GROBID-structured arXiv cs.AI corpus."
readme = "README.md"
authors = [
    { name = "Ge Rui Sen", email = "greyson.rg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "gliner>=0.2.29",
    "glirel>=1.2.1",
    "ijson>=3.5.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "lxml-stubs>=0.5.1",
    "networkx>=3.6.1",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "torch>=2.6.0",
    "transformers>=5.16.1",
]

[project.scripts]
lens = "lens:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---------------------------------------------------------------- code hygiene
# Two buckets, deliberately (Roadmap §12): this config runs now, the *reformat*
# waits until the commit before the M11 freeze so the frozen hash is the clean one.
#
# A (now): pyflakes only. E/W/I are declared in `select` but the rules that fire on
# existing code are ignored until B, so "lint is clean" always means something.
# B (freeze): `ruff format` + drop the ignores + `--fix --select I` (import order),
# committed in batches of <= 6 files to keep review tractable.
[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100          # the code is already mostly <= 100 (67 lines exceed it; 351 exceed 88)
target-version = "py312"
extend-exclude = ["tests/DESTRUCTIVE_db_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Deferred to bucket B (see above). E501 is 67 lines, I001 is nearly every file.
ignore = ["E501", "W291", "W293", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["lens"]

