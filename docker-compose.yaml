# LENS local topology (M8).
#
# - lens-pg     : PostgreSQL + pgvector, host port 5433 (native PG17 owns 5432)
# - lens-repl   : passive Python executor for the RLM, one container per session
#
# The sandbox network is separate from the DB network on purpose: the sandbox
# must never reach Postgres directly. The host tool layer owns the DB connection.
#
# One-time migration: stop/remove the old manual lens-pg container, then
# `docker compose up -d lens-pg`; the named volume lens-pgdata preserves data.
#
# `sandbox-net` is internal to block general egress (Tech Stack 4b: "no network"
# is a thesis claim, not a convenience). That flag interacts with the two other
# host-boundary choices, so verify all three together, in this order:
#   1. host RPC reachable FROM the container: GET $LENS_HOST_RPC_URL/health
#   2. general egress blocked:                a connect to 1.1.1.1:443 must FAIL
#   3. sandbox /exec reachable from the host: GET 127.0.0.1:$LENS_SANDBOX_PORT/health
# If (1) fails while `internal: true` is set, do NOT drop the flag. Give the
# network a fixed subnet and point the RPC at the bridge gateway instead:
#   networks: {sandbox-net: {driver: bridge, internal: true,
#                            ipam: {config: [{subnet: 172.28.0.0/24}]}}}
#   LENS_HOST_RPC_URL=http://172.28.0.1:8765
# (This is the documented F16 fallback; scripts/verify_sandbox.py asserts 1 and 2.)

name: lens

services:
  lens-pg:
    image: pgvector/pgvector:pg16
    container_name: lens-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LENS_DB_USER:-lens}
      POSTGRES_PASSWORD: ${LENS_DB_PASSWORD:-lens}
      POSTGRES_DB: ${LENS_DB_NAME:-lens}
    ports:
      - "5433:5432"
    volumes:
      - lens-pgdata:/var/lib/postgresql/data
    command: ["-c", "shared_buffers=4GB"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LENS_DB_USER:-lens} -d ${LENS_DB_NAME:-lens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  lens-repl:
    build:
      context: ./src              # was: ./src/lens/sandbox
      dockerfile: lens/sandbox/Dockerfile   # note: relative to the CONTEXT
    image: ${LENS_SANDBOX_IMAGE:-lens-repl:0.1.0}
    container_name: lens-repl
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - "${LENS_RUN_WORKSPACE:-D:/lens-data/runs/_sandbox}:/workspace"
    environment:
      PYTHONPATH: /app
      LENS_WORKSPACE: /workspace
      LENS_RUN_ID: ${LENS_RUN_ID:-manual}
      LENS_HOST_RPC_URL: ${LENS_HOST_RPC_URL:-http://host.docker.internal:8765}
      LENS_RPC_TOKEN: ${LENS_RPC_TOKEN:-change-me}
      LENS_SANDBOX_STDOUT_MAX_CHARS: ${LENS_SANDBOX_STDOUT_MAX_CHARS:-20000}
    ports:
      - "127.0.0.1:${LENS_SANDBOX_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - sandbox-net

networks:
  db-net:
    driver: bridge
  sandbox-net:
    driver: bridge
    internal: true

volumes:
  lens-pgdata:
    name: lens-pgdata
