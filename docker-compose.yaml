# LENS local topology.
#
# - lens-pg     : PostgreSQL + pgvector, host port 5433 (native PG17 owns 5432)
# - lens-repl   : passive Python executor for the RLM, one container per session
#
# The sandbox network is separate from the DB network on purpose: the sandbox
# must never reach Postgres directly. The host tool layer owns the DB connection.
#
# One-time migration: stop/remove the old manual lens-pg container, then
# `docker compose up -d lens-pg`; the named volume lens-pgdata preserves data.
#
# `sandbox-net` is internal because blocking egress is a claim this project
# makes, not a convenience. Three host-boundary facts are pinned by
# measurement rather than by hope:
#   1. Host RPC is reachable ONLY through `lens-relay`. From an internal network
#      there is no route to the host at all: `host-gateway` maps to the WSL2 VM's
#      own gateway (ENETUNREACH), the internal network has no DNS (gaierror), and
#      the host's real address (192.168.65.254) is off-bridge. A normal bridge
#      returns 200 for the same probe — so the flag, not the transport, is the
#      constraint. Dropping `internal` would open egress; hence the relay.
#   2. General egress stays blocked: `lens-repl` is on `sandbox-net` only, and its
#      single peer (`lens-relay`) forwards one hard-coded host:port. The relay's
#      second network (`rpc-net`) is the trusted side; the relay takes no target
#      from the client, so it is not a proxy.
#   3. Sandbox `/exec` is reached with
#      `docker compose exec -T lens-repl python /app/exec_client.py` — a process
#      inside the container dials 127.0.0.1:8080 there. Publishing a port is not
#      an option: an internal network gets no DNAT rule, so Docker silently drops
# the mapping.
# `scripts/verify_sandbox.py` asserts 1 and 2.

name: lens

services:
  lens-pg:
    image: pgvector/pgvector:pg16
    container_name: lens-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LENS_DB_USER:-lens}
      POSTGRES_PASSWORD: ${LENS_DB_PASSWORD:-lens}
      POSTGRES_DB: ${LENS_DB_NAME:-lens}
    ports:
      - "5433:5432"
    volumes:
      - lens-pgdata:/var/lib/postgresql/data
    command: ["-c", "shared_buffers=4GB"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LENS_DB_USER:-lens} -d ${LENS_DB_NAME:-lens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  # The sandbox's only peer: forwards one hard-coded host:port so the RLM can
  # reach the host RPC server without giving the sandbox a route off its bridge.
  # It is infrastructure, not an agent capability: no token, no target from the
  # client, no shell.
  lens-relay:
    image: ${LENS_SANDBOX_IMAGE:-lens-repl:0.1.0}
    container_name: lens-relay
    restart: "no"
    entrypoint: ["python", "/app/relay.py"]
    read_only: true
    environment:
      LENS_RELAY_LISTEN_PORT: ${LENS_RELAY_PORT:-8090}
      LENS_RELAY_TARGET_HOST: ${LENS_RELAY_TARGET_HOST:-host.docker.internal}
      LENS_RELAY_TARGET_PORT: ${LENS_HOST_RPC_PORT:-8765}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    networks:
      - sandbox-net    # the sandbox dials this side
      - rpc-net        # the trusted side; the relay only ever forwards one port

  lens-repl:
    build:
      context: ./src              # was: ./src/lens/sandbox
      dockerfile: lens/sandbox/Dockerfile   # note: relative to the CONTEXT
    image: ${LENS_SANDBOX_IMAGE:-lens-repl:0.1.0}
    container_name: lens-repl
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - "${LENS_RUN_WORKSPACE:-D:/lens-data/runs/_sandbox}:/workspace"
    environment:
      PYTHONPATH: /app
      LENS_WORKSPACE: /workspace
      LENS_RUN_ID: ${LENS_RUN_ID:-manual}
      # The relay's address on sandbox-net — never the host directly (see above).
      LENS_HOST_RPC_URL: ${LENS_HOST_RPC_URL:-http://lens-relay:8090}
      LENS_RPC_TOKEN: ${LENS_RPC_TOKEN:-change-me}
      # Same number as the host's config.SANDBOX_STDOUT_MAX_CHARS: a bare
      # `docker compose up` must not capture more than a real run would.
      LENS_SANDBOX_STDOUT_MAX_CHARS: ${LENS_SANDBOX_STDOUT_MAX_CHARS:-6000}
      # Must be the same number as the host's config.MAX_EXEC_BLOCK_S: the image
      # has no lens.config, so this is the runner's only source for the cap.
      LENS_MAX_EXEC_BLOCK_S: ${LENS_MAX_EXEC_BLOCK_S:-120}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - sandbox-net

networks:
  db-net:
    driver: bridge
  sandbox-net:
    driver: bridge
    internal: true
  # The trusted side of the relay: plain bridge, and it is the relay — not the
  # sandbox — that is attached to it.
  rpc-net:
    driver: bridge

volumes:
  lens-pgdata:
    name: lens-pgdata
